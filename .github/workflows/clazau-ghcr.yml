name: clazau-ghcr

# Build this fork and publish it to ghcr.io/clazau/impostor.
#
# Separate from the inherited docker.yml, which pushes to aeonlucid/impostor on
# Docker Hub with credentials this org does not have — it is tag-triggered, so
# it stays dormant here rather than failing on every release.
#
# arm64 matters: the deployment host is aarch64. The upstream Dockerfile already
# branches on TARGETARCH, so a cross-build works without patching it.

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/clazau/impostor

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Built-in token — no PAT to rotate. Needs packages:write above.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # :latest for convenience, plus an immutable sha tag. Deployments
          # should pin the sha — :latest on a game server means an unattended
          # rebuild can swap the binary under live matches.
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Pushed" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ env.IMAGE }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "${{ env.IMAGE }}:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
